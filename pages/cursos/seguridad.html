        }

        .module-lessons.show {

        }

            padding: 12px 20px;
            border-left: 4px solid #ddd;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            margin: 5px;
            border-radius: 3px;

            background: #f0f0f0;

            border-left-color: #667eea;

        }

            border-left-color: #4CAF50;
        }

            content: "✓ ";
            color: #4CAF50;
            font-weight: bold;
        }

            display: none;
        }

            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

            font-size: 2em;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;

            margin-bottom: 15px;

            border-radius: 5px;

            color: #667eea;
            margin-bottom: 15px;
        }

        .topic-list ul {
            margin-left: 20px;
        }

        .topic-list li {

        let currentModule = null;
        let currentLesson = null;
        let completedLessons = [];

        function initializeCourse() {
            renderModulesList();
            if (courseData.modules.length > 0) {
                selectModule(courseData.modules[0].id, courseData.modules[0].lessons[0].id);
            }
        }

        function renderModulesList() {
            const modulesList = document.getElementById('modulesList');
            modulesList.innerHTML = '';

            courseData.modules.forEach(module => {
                const moduleDiv = document.createElement('div');
                moduleDiv.className = 'module';

                const header = document.createElement('div');
                header.className = 'module-header';
                header.innerHTML = `<span>${module.title}</span><span>›</span>`;
                header.onclick = () => toggleModule(module.id);

                const lessonsDiv = document.createElement('div');
                lessonsDiv.className = 'module-lessons';
                lessonsDiv.id = `lessons-${module.id}`;

                module.lessons.forEach(lesson => {
                    const lessonDiv = document.createElement('div');
                    lessonDiv.className = 'lesson';
                    lessonDiv.id = `lesson-${lesson.id}`;
                    lessonDiv.textContent = lesson.title;
                    lessonDiv.onclick = () => selectModule(module.id, lesson.id);
                    lessonsDiv.appendChild(lessonDiv);
                });

                moduleDiv.appendChild(header);
                moduleDiv.appendChild(lessonsDiv);
                modulesList.appendChild(moduleDiv);
            });
        }

        function toggleModule(moduleId) {
            const lessonsDiv = document.getElementById(`lessons-${moduleId}`);
            lessonsDiv.classList.toggle('show');

            const header = this.closest('.module-header');
            header.classList.toggle('active');
        }

        function selectModule(moduleId, lessonId) {
            currentModule = moduleId;
            currentLesson = lessonId;

            // Update sidebar
            document.querySelectorAll('.lesson').forEach(el => el.classList.remove('active'));
            document.getElementById(`lesson-${lessonId}`).classList.add('active');

            // Find and display lesson content
            const module = courseData.modules.find(m => m.id === moduleId);
            const lesson = module.lessons.find(l => l.id === lessonId);

            renderContent(module, lesson);
        }

        function renderContent(module, lesson) {
            const contentContainer = document.getElementById('contentContainer');
            contentContainer.innerHTML = '';

            const title = document.createElement('h2');
            title.className = 'lesson-title';
            title.textContent = lesson.title;
            contentContainer.appendChild(title);

            const meta = document.createElement('p');
            meta.style.cssText = 'color: #666; font-size: 0.9em;';
            meta.textContent = `Módulo: ${module.title} | Duración: ${lesson.duration}`;
            contentContainer.appendChild(meta);

            const lessonContent = document.createElement('div');
            lessonContent.className = 'lesson-content';
            lessonContent.innerHTML = lesson.content;
            contentContainer.appendChild(lessonContent);

            const nav = document.createElement('div');
            nav.className = 'navigation';

            const prevBtn = document.createElement('button');
            prevBtn.className = 'btn btn-secondary';
            prevBtn.textContent = '← Anterior';
            prevBtn.onclick = previousLesson;
            nav.appendChild(prevBtn);

            const completeBtn = document.createElement('button');
            completeBtn.className = 'btn btn-success';
            completeBtn.textContent = '✓ Marcar como Completado';
            completeBtn.onclick = markAsComplete;
            nav.appendChild(completeBtn);

            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn';
            nextBtn.textContent = 'Siguiente →';
            nextBtn.onclick = nextLesson;
            nav.appendChild(nextBtn);

            contentContainer.appendChild(nav);

            updateProgress();
        }

        function markAsComplete() {
            if (!completedLessons.includes(currentLesson)) {
                completedLessons.push(currentLesson);
                document.getElementById(`lesson-${currentLesson}`).classList.add('completed');
                alert('¡Lección marcada como completada!');
                updateProgress();
            } else {
                alert('Ya has completado esta lección.');
            }
        }

        function nextLesson() {
            const lessons = courseData.modules.flatMap(m => m.lessons.map(l => ({ ...l, moduleId: m.id })));
            const currentIndex = lessons.findIndex(l => l.id === currentLesson);

            if (currentIndex < lessons.length - 1) {
                const nextLess = lessons[currentIndex + 1];
                selectModule(nextLess.moduleId, nextLess.id);
            } else {
                alert('¡Has completado todas las lecciones! Accede al examen final desde el módulo de consolidación.');
            }
        }

        function previousLesson() {
            const lessons = courseData.modules.flatMap(m => m.lessons.map(l => ({ ...l, moduleId: m.id })));
            const currentIndex = lessons.findIndex(l => l.id === currentLesson);

            if (currentIndex > 0) {
                const prevLess = lessons[currentIndex - 1];
                selectModule(prevLess.moduleId, prevLess.id);
            }
        }

        function updateProgress() {
            const totalLessons = courseData.modules.reduce((sum, m) => sum + m.lessons.length, 0);
            const progress = (completedLessons.length / totalLessons) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        const totalLessons = courseData.modules.reduce((sum, m) => sum + m.lessons.length, 0);

        initializeCourse();
    </script>
</body>
</html>
