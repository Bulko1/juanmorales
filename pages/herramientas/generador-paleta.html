<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>Generador de Paleta de Colores</title>
    <style>
        :root {
            --bg: #111827;
            --card: #1f2937;
            --text: #d1d5db;
            --title: #ffffff;
            --accent: #38bdf8;
            --border: rgba(255,255,255,0.1);
            --input-bg: #374151;
        }
        html[data-theme='light'] {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #4b5563;
            --title: #111827;
            --border: #e5e7eb;
            --input-bg: #f9fafb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .top-nav .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            transition: background 0.2s;
        }
        .top-nav .back-link:hover { background: var(--input-bg); }
        .top-nav .nav-title { flex: 1; text-align: center; font-weight: 600; color: var(--title); font-size: 0.9rem; }
        .top-nav .theme-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .main-content { padding-top: 4rem; max-width: 640px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
        h1 { text-align: center; color: var(--title); margin: 2rem 0 0.5rem; font-size: 1.5rem; }
        .subtitle { text-align: center; color: var(--text); margin-bottom: 1.5rem; font-size: 0.9rem; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
        }
        .palette { display: flex; height: 200px; border-radius: 0.75rem; overflow: hidden; margin-bottom: 1rem; }
        .color-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            cursor: pointer;
            position: relative;
            padding-bottom: 0.75rem;
            transition: transform 0.15s, filter 0.15s;
        }
        .color-block:hover { transform: scaleY(1.02); }
        .color-block.locked::after {
            content: '🔒';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            opacity: 0.8;
            pointer-events: none;
        }
        .color-block .hex {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            background: rgba(0,0,0,0.5);
            color: white;
            z-index: 1;
            transition: transform 0.15s;
        }
        .color-block:hover .hex { transform: scale(1.1); }
        .actions { display: flex; gap: 0.75rem; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #0ea5e9; color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-secondary { background: var(--input-bg); color: var(--accent); border: 1px solid var(--accent); }
        .btn-secondary:hover { background: var(--accent); color: white; }
        .copied-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 200;
            pointer-events: none;
        }
        .copied-toast.show { opacity: 1; }
        .hint { text-align: center; font-size: 0.8rem; color: var(--text); margin-top: 0.5rem; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="../../" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Portafolio
        </a>
        <span class="nav-title">Generador de Paleta</span>
        <button class="theme-btn" id="themeToggle" title="Cambiar tema">🌓</button>
    </nav>

    <div class="main-content">
        <h1>Generador de Paleta de Colores</h1>
        <p class="subtitle">Haz clic en un color para copiarlo · Haz doble clic para bloquearlo</p>

        <div class="card">
            <div class="palette" id="palette"></div>

            <div class="actions">
                <button class="btn btn-primary" id="generateBtn">Generar Paleta</button>
                <button class="btn btn-secondary" id="copyAllBtn">Copiar Todos</button>
            </div>
        </div>

        <p class="hint">También puedes presionar la barra <strong>espaciadora</strong> para generar</p>
    </div>

    <div class="copied-toast" id="toast">¡Copiado!</div>

    <script>
        const palette = document.getElementById('palette');
        const generateBtn = document.getElementById('generateBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const toast = document.getElementById('toast');
        const themeToggle = document.getElementById('themeToggle');

        let colors = [];
        let locked = new Set();

        function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                return Math.round(255 * (l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1)));
            };
            return `#${[f(0), f(8), f(4)].map(x => x.toString(16).padStart(2, '0')).join('')}`;
        }

        function getTextColor(bg) {
            const r = parseInt(bg.slice(1, 3), 16);
            const g = parseInt(bg.slice(3, 5), 16);
            const b = parseInt(bg.slice(5, 7), 16);
            return (r * 0.299 + g * 0.587 + b * 0.114) > 140 ? '#1f2937' : '#ffffff';
        }

        function generatePalette() {
            const hue = Math.floor(Math.random() * 360);
            const modes = [
                () => [hue, 70, Math.floor(Math.random() * 30 + 20)],
                () => [(hue + 10) % 360, 75, Math.floor(Math.random() * 20 + 40)],
                () => [(hue + 25) % 360, 60, Math.floor(Math.random() * 25 + 20)],
                () => [(hue + 180) % 360, 50, Math.floor(Math.random() * 30 + 30)],
                () => [(hue + 210) % 360, 45, Math.floor(Math.random() * 25 + 50)],
            ];
            colors = modes.map(m => {
                const [h, s, l] = m();
                return hslToHex(h, s, l);
            });
            locked.clear();
            render();
        }

        function render() {
            palette.innerHTML = '';
            colors.forEach((hex, i) => {
                const block = document.createElement('div');
                block.className = 'color-block' + (locked.has(i) ? ' locked' : '');
                block.style.background = hex;
                block.innerHTML = `<span class="hex" style="color:${getTextColor(hex)}">${hex.toUpperCase()}</span>`;
                block.addEventListener('click', async () => {
                    await navigator.clipboard.writeText(hex);
                    showToast(hex);
                });
                block.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    if (locked.has(i)) locked.delete(i);
                    else locked.add(i);
                    render();
                });
                palette.appendChild(block);
            });
        }

        async function copyAll() {
            await navigator.clipboard.writeText(colors.join('\n'));
            showToast('Paleta copiada');
        }

        let toastTimer;
        function showToast(msg) {
            toast.textContent = '¡Copiado! ' + msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        generateBtn.addEventListener('click', generatePalette);
        copyAllBtn.addEventListener('click', copyAll);
        document.addEventListener('keydown', e => {
            if (e.code === 'Space' && document.activeElement === document.body) {
                e.preventDefault();
                generatePalette();
            }
        });

        themeToggle.addEventListener('click', () => {
            const c = document.documentElement.getAttribute('data-theme');
            const n = c === 'light' ? 'dark' : 'light';
            if (n === 'light') document.documentElement.setAttribute('data-theme', 'light');
            else document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', n);
        });

        if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');

        generatePalette();
    </script>
</body>
</html>
