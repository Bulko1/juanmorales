<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>Lista de Tareas</title>
    <style>
        :root {
            --bg: #111827;
            --card: #1f2937;
            --text: #d1d5db;
            --title: #ffffff;
            --accent: #38bdf8;
            --border: rgba(255,255,255,0.1);
            --input-bg: #374151;
            --done: #6b7280;
            --danger: #ef4444;
        }
        html[data-theme='light'] {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #4b5563;
            --title: #111827;
            --border: #e5e7eb;
            --input-bg: #f9fafb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .top-nav .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            transition: background 0.2s;
        }
        .top-nav .back-link:hover { background: var(--input-bg); }
        .top-nav .nav-title { flex: 1; text-align: center; font-weight: 600; color: var(--title); font-size: 0.9rem; }
        .top-nav .theme-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .main-content { padding-top: 4rem; max-width: 520px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
        h1 { text-align: center; color: var(--title); margin: 2rem 0 1.5rem; font-size: 1.5rem; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
        }
        .add-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .add-row input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--title);
            font-size: 1rem;
        }
        .add-row input:focus { outline: none; border-color: var(--accent); }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-primary { background: #0ea5e9; color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-danger { background: none; color: var(--danger); border: 1px solid var(--danger); padding: 0.35rem 0.75rem; font-size: 0.8rem; }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-clear { background: none; color: var(--danger); border: 1px solid var(--danger); padding: 0.5rem 1rem; font-size: 0.85rem; }
        .btn-clear:hover { background: var(--danger); color: white; }
        .filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .filter-btn {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .task-list { list-style: none; }
        .task-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }
        .task-item:last-child { border-bottom: none; }
        .task-item input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; }
        .task-item .task-text { flex: 1; color: var(--title); font-size: 0.95rem; transition: color 0.2s; }
        .task-item.completed .task-text { color: var(--done); text-decoration: line-through; }
        .empty { text-align: center; color: var(--text); padding: 2rem 0; font-size: 0.95rem; }
        .counter { font-size: 0.85rem; color: var(--text); text-align: center; margin-top: 0.75rem; }
        .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="../../" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Portafolio
        </a>
        <span class="nav-title">Lista de Tareas</span>
        <button class="theme-btn" id="themeToggle" title="Cambiar tema">🌓</button>
    </nav>

    <div class="main-content">
        <h1>Lista de Tareas</h1>

        <div class="card">
            <div class="add-row">
                <input type="text" id="taskInput" placeholder="¿Qué necesitas hacer?" maxlength="200">
                <button class="btn btn-primary" id="addBtn">Añadir</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="active">Activas</button>
                <button class="filter-btn" data-filter="completed">Completadas</button>
            </div>

            <ul class="task-list" id="taskList"></ul>

            <div class="empty" id="empty">No hay tareas. ¡Añade una!</div>

            <div class="footer-row">
                <span class="counter" id="counter"></span>
                <button class="btn btn-clear" id="clearCompleted">Limpiar completadas</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'herramientas_tareas';
        let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let filter = 'all';

        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const empty = document.getElementById('empty');
        const counter = document.getElementById('counter');
        const clearCompleted = document.getElementById('clearCompleted');
        const themeToggle = document.getElementById('themeToggle');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

        function render() {
            const filtered = filter === 'all' ? tasks : filter === 'active' ? tasks.filter(t => !t.done) : tasks.filter(t => t.done);
            taskList.innerHTML = '';
            if (filtered.length === 0) {
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                filtered.forEach(t => {
                    const li = document.createElement('li');
                    li.className = 'task-item' + (t.done ? ' completed' : '');
                    li.innerHTML = `
                        <input type="checkbox" ${t.done ? 'checked' : ''}>
                        <span class="task-text">${escapeHtml(t.text)}</span>
                        <button class="btn btn-danger" data-id="${t.id}">Eliminar</button>
                    `;
                    li.querySelector('input').addEventListener('change', () => {
                        t.done = !t.done;
                        save();
                        render();
                    });
                    li.querySelector('button').addEventListener('click', () => {
                        tasks = tasks.filter(x => x.id !== t.id);
                        save();
                        render();
                    });
                    taskList.appendChild(li);
                });
            }
            const pending = tasks.filter(t => !t.done).length;
            counter.textContent = pending + ' tarea' + (pending !== 1 ? 's' : '') + ' pendiente' + (pending !== 1 ? 's' : '');
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;
            tasks.unshift({ id: generateId(), text, done: false, created: Date.now() });
            taskInput.value = '';
            save();
            render();
        }

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filter = btn.dataset.filter;
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                render();
            });
        });

        clearCompleted.addEventListener('click', () => {
            tasks = tasks.filter(t => !t.done);
            save();
            render();
        });

        themeToggle.addEventListener('click', () => {
            const c = document.documentElement.getAttribute('data-theme');
            const n = c === 'light' ? 'dark' : 'light';
            if (n === 'light') document.documentElement.setAttribute('data-theme', 'light');
            else document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', n);
        });

        if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');

        render();
    </script>
</body>
</html>
