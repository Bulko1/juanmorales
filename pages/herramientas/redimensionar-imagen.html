<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://mindicador.cl;">
    <title>Redimensionador de Imágenes</title>
    <style>
        :root {
            --bg: #111827;
            --card: #1f2937;
            --text: #d1d5db;
            --title: #ffffff;
            --accent: #38bdf8;
            --border: rgba(255,255,255,0.1);
            --input-bg: #374151;
        }
        html[data-theme='light'] {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #4b5563;
            --title: #111827;
            --border: #e5e7eb;
            --input-bg: #f9fafb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .top-nav .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            transition: background 0.2s;
        }
        .top-nav .back-link:hover { background: var(--input-bg); }
        .top-nav .nav-title { flex: 1; text-align: center; font-weight: 600; color: var(--title); font-size: 0.9rem; }
        .top-nav .theme-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .main-content { padding-top: 4rem; max-width: 600px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
        h1 { text-align: center; color: var(--title); margin: 2rem 0 1.5rem; font-size: 1.5rem; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
        }
        .field { margin-bottom: 1.25rem; }
        .field label { display: block; color: var(--title); font-weight: 500; margin-bottom: 0.4rem; font-size: 0.9rem; }
        input[type="file"] {
            width: 100%;
            color: var(--text);
            font-size: 0.9rem;
        }
        input[type="file"]::file-selector-button {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            margin-right: 0.75rem;
        }
        input[type="number"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--title);
            font-size: 1rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #0ea5e9; color: white; width: 100%; }
        .btn-primary:hover { background: #0284c7; }
        canvas {
            display: block;
            max-width: 100%;
            margin: 1rem auto 0;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
        }
        .download-links {
            display: none;
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }
        .download-links a {
            background: var(--input-bg);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .download-links a:hover { background: var(--accent); color: white; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="../../" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Portafolio
        </a>
        <span class="nav-title">Redimensionador de Imágenes</span>
        <button class="theme-btn" id="themeToggle" title="Cambiar tema">🌓</button>
    </nav>

    <div class="main-content">
        <h1>Redimensionador de Imágenes</h1>
        <div class="card">
            <div class="field">
                <label>Seleccionar imagen</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>
            <div class="field">
                <label for="scale">Escala (%)</label>
                <input type="number" id="scale" value="100" min="1" max="500">
            </div>
            <button class="btn btn-primary" id="resizeButton">Redimensionar</button>
            <canvas id="canvas"></canvas>
            <div class="download-links" id="downloadLinks" style="display:none;">
                <a id="downloadPng">PNG</a>
                <a id="downloadJpg">JPG</a>
                <a id="downloadIco">ICO</a>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const scaleInput = document.getElementById('scale');
        const resizeButton = document.getElementById('resizeButton');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadLinks = document.getElementById('downloadLinks');
        const downloadPng = document.getElementById('downloadPng');
        const downloadJpg = document.getElementById('downloadJpg');
        const downloadIco = document.getElementById('downloadIco');
        const themeToggle = document.getElementById('themeToggle');

        let originalImage = new Image();

        imageInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => { originalImage.src = e.target.result; };
                reader.readAsDataURL(file);
            }
        });

        originalImage.onload = () => {
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            ctx.drawImage(originalImage, 0, 0);
        };

        resizeButton.addEventListener('click', () => {
            const scalePercent = parseInt(scaleInput.value);
            if (isNaN(scalePercent) || scalePercent < 1 || scalePercent > 500) {
                alert('Por favor, ingresa una escala válida entre 1 y 500');
                return;
            }
            const scale = scalePercent / 100;
            const newWidth = originalImage.width * scale;
            const newHeight = originalImage.height * scale;
            canvas.width = newWidth;
            canvas.height = newHeight;
            ctx.drawImage(originalImage, 0, 0, newWidth, newHeight);

            downloadPng.href = canvas.toDataURL('image/png');
            downloadPng.download = 'imagen_redimensionada.png';
            downloadJpg.href = canvas.toDataURL('image/jpeg');
            downloadJpg.download = 'imagen_redimensionada.jpg';
            downloadIco.href = canvas.toDataURL('image/x-icon');
            downloadIco.download = 'imagen_redimensionada.ico';
            downloadLinks.style.display = 'flex';
        });

        themeToggle.addEventListener('click', () => {
            const c = document.documentElement.getAttribute('data-theme');
            const n = c === 'light' ? 'dark' : 'light';
            if (n === 'light') document.documentElement.setAttribute('data-theme', 'light');
            else document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', n);
        });

        if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
    </script>
</body>
</html>
