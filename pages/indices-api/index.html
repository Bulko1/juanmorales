<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://mindicador.cl;">
    <meta name="description" content="Índices económicos en tiempo real - Consulta valores actualizados de indicadores financieros">
    <title>Índices Económicos</title>
    <!-- Local Bootstrap CSS -->
    <link href="../../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="styles.css" rel="stylesheet">
    <style>
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1100;
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            background: var(--card-bg, #111318);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: background-color 0.3s ease;
        }
        body:not(.dark-mode) .top-nav {
            background: #ffffff;
            border-bottom-color: #d1d5db;
        }
        .top-nav .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            transition: background-color 0.2s;
        }
        .top-nav .back-link:hover {
            background-color: rgba(255,255,255,0.1);
        }
        body:not(.dark-mode) .top-nav .back-link:hover {
            background-color: #f3f4f6;
        }
        .top-nav .back-link svg {
            width: 16px;
            height: 16px;
        }
        .top-nav .nav-title {
            flex: 1;
            text-align: center;
            font-weight: 600;
            color: inherit;
            font-size: 0.9rem;
        }
        .top-nav .nav-spacer {
            width: 100px;
        }
        .main-content {
            padding-top: 4rem;
        }
    </style>
</head>
<body class="dark-mode">
    <!-- Barra de Navegación Superior -->
    <nav class="top-nav">
        <a href="../../" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Portafolio
        </a>
        <span class="nav-title">Índices Económicos</span>
        <span class="nav-spacer"></span>
    </nav>
    <div class="main-content">
        <div class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-4 position-relative">
                <h1 class="text-center w-100">Índices Económicos</h1>
                <button id="theme-toggle" aria-label="Cambiar Tema" class="position-absolute top-0 end-0">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
            <div id="cards-container" class="row row-cols-2 row-cols-md-2 g-custom">
            </div>
        </div>
    </div>
    <!-- Local Bootstrap JS -->
    <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- Custom Scripts -->
    <script src="scripts.js"></script>
</body>
</html>
