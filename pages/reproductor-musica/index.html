<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:;">
    <meta name="description" content="Reproductor de música con playlist - Agrega y reproduce tus archivos de audio">
    <title>Reproductor de Música</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <nav class="top-nav">
        <a href="../../" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Portafolio
        </a>
        <span class="nav-title">Reproductor de Música</span>
        <button class="theme-btn" id="themeToggle" title="Cambiar tema">🌓</button>
    </nav>

    <div class="main-content">
        <div class="player-card">
            <div class="cover-art">
                <svg id="coverIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
            </div>

            <div class="track-info">
                <h2 id="trackName">Ninguna canción seleccionada</h2>
                <p id="trackInfo">Agrega canciones para comenzar</p>
            </div>

            <div class="progress-section">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" id="prevBtn" title="Anterior">⏮</button>
                <button class="ctrl-btn play-btn" id="playBtn" title="Reproducir">▶</button>
                <button class="ctrl-btn" id="nextBtn" title="Siguiente">⏭</button>
            </div>

            <div class="volume-section">
                <button class="ctrl-btn" id="volumeBtn" title="Silenciar">🔊</button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </div>

        <div class="playlist-section">
            <div class="playlist-header">
                <h3>Playlist</h3>
                <button class="add-btn" id="addBtn">+ Agregar canciones</button>
                <input type="file" id="fileInput" accept="audio/*" multiple hidden>
            </div>
            <ul id="playlist" class="playlist"></ul>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
