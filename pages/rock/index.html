<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
    <title>Árbol Genealógico del Rock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Roboto Condensed', sans-serif;
            background-color: #0f0f0f;
            color: #e0e0e0;
            background-image: radial-gradient(#1f1f1f 1px, transparent 1px);
            background-size: 30px 30px;
        }
        h1, h2, h3, .rock-font { font-family: 'Oswald', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 4px; }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 15px rgba(239,68,68,0.3);
            border-color: #ef4444;
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <header class="fixed top-0 w-full z-50 bg-black/90 backdrop-blur-sm border-b border-red-900/50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="../../" class="inline-flex items-center gap-1 text-gray-400 hover:text-red-400 transition-colors" title="Volver al Portafolio">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </a>
                <i data-lucide="music" class="text-red-500 w-8 h-8"></i>
                <h1 class="text-2xl md:text-3xl font-bold uppercase tracking-wider text-white">
                    Rock <span class="text-red-500">Evolution</span>
                </h1>
            </div>
            <button onclick="scrollToTop()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1 rounded text-sm uppercase font-bold transition-colors">
                Inicio
            </button>
        </div>
    </header>

    <main class="pt-24 pb-16">
        <div class="container mx-auto px-4 max-w-5xl">
            <h2 class="text-4xl md:text-5xl font-bold uppercase text-center mb-4 rock-font">
                Árbol <span class="text-red-500">Genealógico</span> del Rock
            </h2>
            <p class="text-center text-gray-400 mb-16 max-w-2xl mx-auto">
                Explora la evolución del rock desde sus raíces en el blues de los años 50 hasta las fusiones contemporáneas.
            </p>

            <div class="relative timeline-line" id="timeline"></div>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.85);">
        <div class="bg-gray-900 border border-red-900/50 rounded-xl max-w-lg w-full p-6 transform transition-all duration-300 scale-95" id="modalContent">
            <div class="flex justify-between items-start mb-4">
                <h3 class="text-2xl font-bold rock-font text-white" id="modalTitle"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-400 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <p class="text-gray-300" id="modalDesc"></p>
            <div class="mt-4" id="modalBands"></div>
        </div>
    </div>

    <script>
        const rockData = [
            {
                era: "Años 50", color: "red",
                genres: [
                    { name: "Rock & Roll", desc: "El nacimiento. Ritmos enérgicos derivados del rhythm & blues y el country.", bands: ["Elvis Presley", "Chuck Berry", "Little Richard", "Buddy Holly"] },
                    { name: "Rockabilly", desc: "Fusión primitiva de country sureño con rhythm & blues acelerado.", bands: ["Carl Perkins", "Gene Vincent", "Eddie Cochran"] }
                ]
            },
            {
                era: "Años 60", color: "orange",
                genres: [
                    { name: "British Invasion", desc: "Bandas británicas reinventan el rock americano con melodías propias.", bands: ["The Beatles", "The Rolling Stones", "The Who", "The Kinks"] },
                    { name: "Psychedelic Rock", desc: "Experimentación sonora con drogas psicodélicas y estudios de grabación.", bands: ["Pink Floyd", "Jimi Hendrix", "The Doors", "Jefferson Airplane"] },
                    { name: "Folk Rock", desc: "Letras poéticas y conciencia social con instrumentación eléctrica.", bands: ["Bob Dylan", "Simon & Garfunkel", "The Byrds"] }
                ]
            },
            {
                era: "Años 70", color: "yellow",
                genres: [
                    { name: "Hard Rock", desc: "Guitarras saturadas, riffs contundentes y actitud rebelde.", bands: ["Led Zeppelin", "Deep Purple", "AC/DC", "Aerosmith"] },
                    { name: "Progressive Rock", desc: "Estructuras complejas, albums conceptuales y virtuosismo instrumental.", bands: ["Yes", "Genesis", "King Crimson", "Emerson, Lake & Palmer"] },
                    { name: "Punk Rock", desc: "Reacción visceral: canciones cortas, rápidas y letras contestatarias.", bands: ["Ramones", "Sex Pistols", "The Clash"] },
                    { name: "Glam Rock", desc: "Teatralidad, androginia y estética extravagante.", bands: ["David Bowie", "T. Rex", "Queen"] }
                ]
            },
            {
                era: "Años 80", color: "purple",
                genres: [
                    { name: "Heavy Metal", desc: "Evolución extrema del hard rock: velocidad, poder y técnica.", bands: ["Iron Maiden", "Metallica", "Judas Priest", "Black Sabbath"] },
                    { name: "New Wave", desc: "Rock con sintetizadores y estética moderna influenciada por el punk.", bands: ["The Cure", "Depeche Mode", "Talking Heads"] },
                    { name: "Hardcore Punk", desc: "Punk llevado al extremo: más rápido, más agresivo, más político.", bands: ["Black Flag", "Dead Kennedys", "Minor Threat"] }
                ]
            },
            {
                era: "Años 90", color: "blue",
                genres: [
                    { name: "Grunge", desc: "Desde Seattle: distorsión pesada, letras introspectivas y estética descuidada.", bands: ["Nirvana", "Pearl Jam", "Soundgarden", "Alice in Chains"] },
                    { name: "Britpop", desc: "Resurgimiento del orgullo británico con melodías pop y guitarras.", bands: ["Oasis", "Blur", "Pulp", "Suede"] },
                    { name: "Alternative Rock", desc: "Todo lo que no encajaba en el mainstream: experimental y diverso.", bands: ["Radiohead", "R.E.M.", "Smashing Pumpkins"] }
                ]
            },
            {
                era: "2000s+", color: "green",
                genres: [
                    { name: "Indie Rock", desc: "Producción DIY, sellos independientes y sonido lo-fi auténtico.", bands: ["The Strokes", "Arcade Fire", "Arctic Monkeys"] },
                    { name: "Post-Rock", desc: "Texturas instrumentales, crescendos épicos y estructuras cinematográficas.", bands: ["Explosions in the Sky", "Sigur Rós", "Godspeed You! Black Emperor"] },
                    { name: "Nu-Metal Revival", desc: "Fusión moderna de metal, rap y electrónica con actitud contemporánea.", bands: ["Linkin Park", "Slipknot", "System of a Down"] }
                ]
            }
        ];

        function openModal(genre) {
            document.getElementById('modalTitle').textContent = genre.name;
            document.getElementById('modalDesc').textContent = genre.desc;
            document.getElementById('modalBands').innerHTML = genre.bands.map(b =>
                `<span class="inline-block bg-red-900/30 text-red-300 px-3 py-1 rounded-full text-sm mr-2 mb-2 font-semibold">${b}</span>`
            ).join('');
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('modalContent').classList.remove('scale-95');
                document.getElementById('modalContent').classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => document.getElementById('modal').classList.add('hidden'), 300);
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = rockData.map(era => `
                <div class="mb-16">
                    <h3 class="text-3xl font-bold rock-font uppercase mb-6 text-center text-${era.color}-500">${era.era}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${era.genres.map(g => `
                            <div class="card-hover bg-gray-900 border border-gray-800 rounded-lg p-5 cursor-pointer transition-all duration-300" onclick='openModal(${JSON.stringify(g).replace(/'/g, "&#39;")})'>
                                <h4 class="text-lg font-bold rock-font text-white mb-2">${g.name}</h4>
                                <p class="text-gray-400 text-sm line-clamp-2">${g.desc.substring(0, 80)}...</p>
                                <div class="flex flex-wrap gap-1 mt-3">
                                    ${g.bands.slice(0, 3).map(b => `<span class="text-red-400 text-xs font-semibold bg-red-900/20 px-2 py-0.5 rounded">${b}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', renderTimeline);
    </script>
</body>
</html>
